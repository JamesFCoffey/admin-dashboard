name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy-target:
        description: "Set to 'production' to deploy a production build via Vercel"
        required: false
        default: preview

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'

jobs:
  quality-checks:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
        env:
          CI: 'true'

      - name: Verify GraphQL code generation
        run: npm run codegen:verify

      - name: Build application
        run: npm run build

  deploy-preview:
    name: Deploy preview to Vercel
    needs: quality-checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment configuration
        run: vercel pull --yes --environment=preview --token ${{ env.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --token ${{ env.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token ${{ env.VERCEL_TOKEN }})
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Expose preview URL
        run: echo "Preview: ${{ steps.deploy.outputs.preview_url }}"

  deploy-production:
    name: Deploy production to Vercel
    needs: quality-checks
    if: github.event_name == 'workflow_dispatch' && github.event.inputs['deploy-target'] == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment configuration
        run: vercel pull --yes --environment=production --token ${{ env.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token ${{ env.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token ${{ env.VERCEL_TOKEN }})
          echo "production_url=$url" >> "$GITHUB_OUTPUT"

      - name: Expose production URL
        run: echo "Production: ${{ steps.deploy.outputs.production_url }}"
